<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>تحصيل الكفالات</title>
<link rel="stylesheet" href="style.css">
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
<style>
  body { background: linear-gradient(180deg, #e8f0eb 0%, var(--cream) 100%); }
  .hero { text-align: center; padding: 20px 20px 12px; }
  .hero .leaf { font-size: 26px; color: var(--accent); }
  .hero h1 { font-size: 22px; color: var(--accent); margin: 8px 0 4px; font-weight: 700; }
  .hero .greeting { color: var(--muted); font-size: 13px; }

  .salawat-banner {
    text-align: center; color: var(--gold);
    padding: 8px; font-size: 13px;
    background: var(--cream-deep); border-radius: var(--r-sm);
    margin: 0 0 14px; transition: opacity 300ms;
  }

  .month-switch { display: flex; gap: 8px; justify-content: center; margin: 14px 0; flex-wrap: wrap; }
  .month-btn {
    padding: 10px 22px; background: #fff; border: 2px solid var(--border);
    border-radius: var(--r); cursor: pointer; font-size: 13px;
    text-align: center; min-width: 110px; transition: all var(--t-fast); font-family: inherit;
  }
  .month-btn:hover { border-color: var(--accent); }
  .month-btn.active { background: var(--accent); color: #fff; border-color: var(--accent); box-shadow: var(--shadow); }
  .month-btn .label { font-weight: 700; font-size: 14px; margin-bottom: 1px; }
  .month-btn .amount { font-size: 11px; opacity: 0.8; }

  .progress-section {
    background: linear-gradient(135deg, var(--accent) 0%, var(--accent-light) 100%);
    color: #fff; padding: 18px 20px; border-radius: var(--r-lg);
    box-shadow: var(--shadow); margin-bottom: 16px;
  }
  .progress-section .title { font-size: 12px; opacity: 0.9; margin-bottom: 6px; }
  .progress-section .main { font-size: 24px; font-weight: 800; }
  .progress-bar { height: 8px; background: rgba(255,255,255,0.2); border-radius: 10px; overflow: hidden; margin: 10px 0 8px; }
  .progress-bar .fill { height: 100%; background: var(--gold); border-radius: 10px; transition: width 600ms cubic-bezier(.4,0,.2,1); }
  .progress-stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-top: 10px; font-size: 12px; }
  .progress-stats .box { text-align: center; }
  .progress-stats .box .num { font-size: 18px; font-weight: 700; }
  .progress-stats .box .lbl { opacity: 0.8; font-size: 10px; margin-top: 2px; }

  /* NEW: Collector tabs */
  .collector-tabs {
    display: flex; gap: 6px; margin-bottom: 12px;
    background: #fff; padding: 5px; border-radius: var(--r);
    border: 1px solid var(--border); box-shadow: var(--shadow-sm);
  }
  .collector-tab {
    flex: 1; padding: 9px 12px; cursor: pointer; border: none; background: transparent;
    border-radius: var(--r-sm); font-size: 13px; font-weight: 600;
    color: var(--muted); font-family: inherit; transition: all var(--t-fast);
  }
  .collector-tab:hover { background: var(--cream); color: var(--accent); }
  .collector-tab.active { background: var(--accent); color: #fff; }
  .collector-tab .cnt { font-size: 11px; opacity: 0.75; margin-right: 4px; }

  /* Filter chips */
  .filter-chips { display: flex; gap: 6px; margin-bottom: 10px; flex-wrap: wrap; }
  .fc {
    padding: 5px 12px; border-radius: 14px; font-size: 12px; cursor: pointer;
    background: #fff; border: 1px solid var(--border); color: var(--muted);
    font-weight: 500; transition: all var(--t-fast); font-family: inherit;
  }
  .fc:hover { border-color: var(--accent); color: var(--accent); }
  .fc.active { background: var(--accent); color: #fff; border-color: var(--accent); }

  .search-wrap { position: relative; margin-bottom: 12px; }
  .search-wrap input { padding: 10px 40px 10px 14px; background: #fff; font-size: 14px; }
  .search-wrap::before { content: '🔍'; position: absolute; left: 14px; top: 50%; transform: translateY(-50%); opacity: 0.4; }
  .search-hint { font-size: 11px; color: var(--muted-light); margin-top: 3px; padding-right: 10px; }

  .pt-list { display: flex; flex-direction: column; gap: 8px; }
  .pt-card {
    background: #fff; border: 1px solid var(--border-light); border-radius: var(--r);
    overflow: hidden; box-shadow: var(--shadow-sm); transition: all var(--t-fast);
  }
  .pt-card:hover { box-shadow: var(--shadow); }
  .pt-card.expanded { border-color: var(--accent); }

  .pt-header {
    padding: 12px 16px; cursor: pointer;
    display: flex; align-items: center; gap: 10px;
    transition: background var(--t-fast);
  }
  .pt-header:hover { background: var(--cream); }
  .pt-indicator { width: 11px; height: 11px; border-radius: 50%; background: var(--border); flex-shrink: 0; }
  .pt-indicator.paid { background: var(--success); }
  .pt-indicator.partial { background: var(--gold); }
  .pt-indicator.unpaid { background: var(--danger); }
  .pt-indicator.prepaid { background: var(--info); }
  .pt-name { flex: 1; font-weight: 600; font-size: 14px; }
  .pt-name .pt-sub { font-size: 11px; color: var(--muted); font-weight: 400; margin-top: 2px; }
  .pt-amount { font-size: 13px; color: var(--muted); font-feature-settings: "tnum"; }
  .pt-amount b { color: var(--accent); }
  .pt-chevron { color: var(--muted-light); transition: transform var(--t-fast); font-size: 10px; }
  .pt-card.expanded .pt-chevron { transform: rotate(180deg); }

  /* === PAID BUTTON — primary action, big and clear === */
  .paid-btn {
    padding: 8px 18px; border-radius: 10px;
    border: 2px solid var(--border);
    background: #fff; color: var(--muted);
    font-weight: 700; font-size: 13px;
    cursor: pointer; font-family: inherit;
    transition: all 150ms ease;
    display: inline-flex; align-items: center; gap: 6px;
    white-space: nowrap; min-width: 92px; justify-content: center;
  }
  .paid-btn:hover:not(:disabled) {
    border-color: var(--accent); color: var(--accent);
    background: var(--cream);
  }
  .paid-btn.paid {
    background: var(--success); border-color: var(--success); color: #fff;
  }
  .paid-btn.paid:hover { background: #245a40; }
  .paid-btn.prepaid {
    background: var(--info); border-color: var(--info); color: #fff;
    cursor: default; opacity: 0.95;
  }

  /* Paid state styling for rows */
  .pt-card.all-paid { background: #f0faf3; border-color: var(--success); }
  .kafeel-row.paid-row { background: #f0faf3; border-radius: 6px; margin: 0 -6px; padding-right: 6px; padding-left: 6px; }

  /* UNIFIED mode: PT = only kafeel, single row with everything inline */
  .pt-card.unified .unified-row {
    display: grid;
    grid-template-columns: auto 1fr auto auto auto auto;
    gap: 10px;
    align-items: center;
    padding: 14px 16px;
  }

  .unified-info { min-width: 0; }
  .unified-name { font-weight: 600; font-size: 14px; }
  .unified-sub { font-size: 11px; opacity: 0.6; margin-right: 4px; }
  .unified-detail { font-size: 11.5px; color: var(--muted); margin-top: 2px; word-break: break-word; }
  .unified-amount { font-size: 13.5px; color: var(--accent); font-feature-settings: "tnum"; white-space: nowrap; }
  .unified-actions { display: flex; gap: 6px; align-items: center; }
  .prepaid-select {
    padding: 5px 10px; font-size: 11.5px; width: auto; min-width: 110px;
    border: 1px solid var(--border); border-radius: 6px; background: #fff;
    font-family: inherit;
  }
  .prepaid-select:focus { border-color: var(--accent); }
  .notes-btn {
    background: transparent; border: none; cursor: pointer;
    font-size: 15px; padding: 4px 8px; color: var(--muted-light);
    transition: all var(--t-fast);
  }
  .notes-btn:hover { color: var(--accent); background: var(--cream); border-radius: 6px; }
  .notes-btn.active { color: var(--gold); }
  .unified-notes { display: none; padding: 0 16px 14px; }
  .unified-notes textarea {
    width: 100%; min-height: 50px; padding: 8px 10px;
    font-size: 12px; border: 1px solid var(--border); border-radius: 6px;
    resize: vertical; font-family: inherit;
  }
  .pt-card.notes-open .unified-notes { display: block; }

  .pt-body { display: none; padding: 0 16px 14px; border-top: 1px solid var(--border-light); background: var(--cream); }
  .pt-card.expanded .pt-body { display: block; }

  .kafeel-row {
    padding: 10px 0; display: flex; align-items: center; gap: 10px;
    border-bottom: 1px dashed var(--border-light);
  }
  .kafeel-row:last-child { border-bottom: none; }

  .kafeel-info { flex: 1; min-width: 0; }
  .kafeel-name { font-weight: 600; font-size: 13.5px; }
  .kafeel-detail { font-size: 11.5px; color: var(--muted); margin-top: 2px; word-break: break-word; }
  .kafeel-amount { font-weight: 700; font-size: 13.5px; color: var(--accent); font-feature-settings: "tnum"; flex-shrink: 0; }

  /* Inline prepaid picker */
  .inline-prepaid {
    display: flex; align-items: center; gap: 4px;
    margin-right: auto; flex-shrink: 0;
  }
  .inline-prepaid select {
    padding: 4px 8px; font-size: 11.5px; width: auto; min-width: 100px;
    border: 1px solid var(--border); background: #fff; border-radius: 6px;
    font-family: inherit;
  }
  .inline-prepaid select:focus { border-color: var(--accent); }
  .inline-prepaid-label { font-size: 10px; color: var(--muted); white-space: nowrap; }

  .kafeel-expand-btn {
    background: transparent; border: none; cursor: pointer;
    font-size: 15px; padding: 2px 6px; color: var(--muted-light);
    transition: all var(--t-fast); flex-shrink: 0;
  }
  .kafeel-expand-btn:hover { color: var(--accent); }
  .kafeel-expand-btn.active { color: var(--gold); }

  .kafeel-notes-box {
    display: none; padding: 8px 8px 0;
    grid-column: 1 / -1;
  }
  .kafeel-row.notes-open .kafeel-notes-box { display: block; }
  .kafeel-notes-box textarea {
    width: 100%; min-height: 50px; padding: 6px 10px;
    font-size: 12px; border: 1px solid var(--border); border-radius: 6px;
    resize: vertical; font-family: inherit;
  }

  .kafeel-row { display: grid; grid-template-columns: 1fr auto auto auto auto; column-gap: 10px; row-gap: 0; align-items: center; }
  .kafeel-info { grid-column: 1; min-width: 0; }
  .paid-btn.kafeel-paid-btn { grid-column: 2; }
  .prepaid-select.kafeel-prepaid { grid-column: 3; }
  .kafeel-amount { grid-column: 4; }
  .notes-btn { grid-column: 5; }
  .kafeel-notes-box { display: none; grid-column: 1 / -1; padding: 8px 0 0; }
  .kafeel-row.notes-open .kafeel-notes-box { display: block; }
  .kafeel-notes-box textarea {
    width: 100%; min-height: 50px; padding: 6px 10px;
    font-size: 12px; border: 1px solid var(--border); border-radius: 6px;
    resize: vertical; font-family: inherit;
  }

  /* Cloud status */
  .cloud-status {
    position: fixed; bottom: 20px; left: 20px;
    padding: 8px 14px; background: #fff; border-radius: 20px; font-size: 12px;
    box-shadow: var(--shadow); color: var(--muted); z-index: 50;
  }
  .cloud-status.ok { color: var(--success); }
  .cloud-status.saving { color: var(--gold); }
  .cloud-status.offline { color: var(--danger); }

  .salawat-popup {
    position: fixed; inset: 0; background: rgba(10,26,20,0.65); backdrop-filter: blur(8px);
    display: flex; align-items: center; justify-content: center;
    z-index: 500; padding: 20px; animation: fadeIn 300ms ease; cursor: pointer;
  }
  .salawat-popup .inner {
    background: linear-gradient(135deg, #fff 0%, var(--cream) 100%);
    padding: 36px 32px; border-radius: 20px; text-align: center; max-width: 420px;
    box-shadow: var(--shadow-xl);
  }
  .salawat-popup .inner .icon { font-size: 44px; color: var(--gold); margin-bottom: 14px; }
  .salawat-popup .inner .text { font-size: 20px; color: var(--accent); font-weight: 600; line-height: 1.6; }
  .salawat-popup .inner .dismiss { font-size: 11px; color: var(--muted); margin-top: 20px; }

  .offline-banner {
    position: fixed; top: 0; left: 0; right: 0;
    background: var(--danger); color: #fff; padding: 10px 20px; text-align: center;
    font-size: 13px; z-index: 300; animation: slideDown 300ms;
  }
  @keyframes slideDown { from { transform: translateY(-100%); } to { transform: translateY(0); } }

  .submit-btn {
    position: fixed; bottom: 70px; left: 50%; transform: translateX(-50%);
    background: var(--gold); color: var(--ink);
    padding: 12px 24px; border-radius: 24px; font-weight: 700; font-size: 14px;
    cursor: pointer; border: none; box-shadow: var(--shadow-lg);
    display: none; z-index: 40;
  }
  .submit-btn.show { display: inline-flex; }
  .submit-btn:hover { transform: translateX(-50%) translateY(-2px); background: var(--gold-light); }

  @media (max-width: 720px) {
    .kafeel-row { grid-template-columns: auto 1fr auto; row-gap: 6px; }
    .paid-btn.kafeel-paid-btn { grid-column: 1 / 3; grid-row: 2; }
    .kafeel-info { grid-column: 2; grid-row: 1; }
    .kafeel-amount { grid-column: 3; grid-row: 1; }
    .inline-prepaid { grid-column: 1 / 3; grid-row: 2; margin: 0; }
    .kafeel-expand-btn { grid-column: 3; grid-row: 2; justify-self: end; }
  }
</style>
</head>
<body>

<!-- TOPBAR -->
<div class="topbar">
  <h1>🌿 التحصيل</h1>
  <div class="right">
    <a href="home.html">🏠 الرئيسية</a>
    <span id="monthChipHolder"></span>
    <a href="admin.html" class="hide-mobile">إدارة</a>
    <a href="closure.html" class="hide-mobile">إقفال</a>
    <span class="logout" onclick="logout()">خروج</span>
  </div>
</div>

<div class="container" style="max-width: 820px;">

  <div class="hero">
    <div class="leaf">🌿</div>
    <h1>تحصيل الكفالات</h1>
    <div class="greeting">اللهم صلّ وسلم على سيدنا محمد ﷺ</div>
  </div>

  <div class="salawat-banner" id="salawat">اللهم صلّ على محمد و على آل محمد</div>

  <div class="progress-section">
    <div class="title" id="progressTitle">متابعة التحصيل</div>
    <div class="main" id="progressMain">—</div>
    <div class="progress-bar"><div class="fill" id="progressFill" style="width:0%"></div></div>
    <div class="progress-stats">
      <div class="box"><div class="num" id="statAll">—</div><div class="lbl">الكل</div></div>
      <div class="box"><div class="num" id="statRemain">—</div><div class="lbl">متبقي</div></div>
      <div class="box"><div class="num" id="statDone">—</div><div class="lbl">محصّل</div></div>
      <div class="box"><div class="num" id="statPrepaid">—</div><div class="lbl">مقدماً</div></div>
    </div>
  </div>

  <!-- NEW: Collector tabs -->
  <div class="collector-tabs" id="collectorTabs"></div>

  <!-- NEW: Filter chips -->
  <div class="filter-chips">
    <button class="fc active" data-filter="all" onclick="setFilter('all')">الكل</button>
    <button class="fc" data-filter="unpaid" onclick="setFilter('unpaid')">غير مدفوع</button>
    <button class="fc" data-filter="paid" onclick="setFilter('paid')">مدفوع</button>
    <button class="fc" data-filter="prepaid" onclick="setFilter('prepaid')">مقدماً</button>
    <button class="fc" data-filter="partial" onclick="setFilter('partial')">جزئي</button>
  </div>

  <div class="search-wrap">
    <input type="text" id="search" placeholder="بحث..." oninput="renderList()">
  </div>
  <div class="search-hint">💡 البحث يشمل: اسم المحصّل، اسم الكفيل، اسم الطفل، اسم ولي الأمر</div>

  <div style="display:flex;justify-content:flex-end;margin:8px 0">
    <button class="fc" onclick="exportCollectionFiltered()" style="background:var(--gold);color:#fff;border-color:var(--gold)">📥 تصدير النتائج CSV</button>
  </div>

  <div class="pt-list" id="ptList" style="margin-top:14px"></div>

  <div style="height: 80px"></div>
</div>

<button class="submit-btn" id="submitBtn" onclick="submitProgress()">📨 إرسال التقدم</button>
<div class="cloud-status" id="cloudStatus">⏳ جاري التحميل...</div>

<script src="config.js"></script>
<script>
// NO AUTH for Nashwa's tool
initFirebase();

let allKafalat = {}, allPeople = {}, state = {};
let CURRENT_MONTH = getWorkingMonth();
let saveTimer = null;
let syncingFromCloud = false;
let firebaseReady = false;
let interactionCount = 0;
let collectorFilter = 'all'; // 'all' | 'nashwa' | 'youssef'
let statusFilter = 'all'; // 'all' | 'unpaid' | 'paid' | 'prepaid' | 'partial'
const SALAWAT_POPUP_EVERY = 20;

const SALAWAT = [
  'اللهم صلّ على سيدنا محمد وعلى آله وصحبه وسلم',
  'اللهم صلّ على محمد و على آل محمد',
  'صلى الله على محمد',
  'اللهم صلّ وسلم وبارك على سيدنا محمد',
  'صلى الله عليه وسلم',
];
let salawatIdx = 0;
setInterval(() => {
  salawatIdx = (salawatIdx + 1) % SALAWAT.length;
  const el = document.getElementById('salawat');
  el.style.opacity = '0';
  setTimeout(() => { el.textContent = SALAWAT[salawatIdx]; el.style.opacity = '1'; }, 300);
}, 10000);

function setCloudStatus(type, msg) {
  const el = document.getElementById('cloudStatus');
  el.className = 'cloud-status ' + type;
  el.textContent = msg;
}

async function load() {
  setCloudStatus('saving', '⏳ تحميل البيانات...');
  try {
    CURRENT_MONTH = getWorkingMonth();
    renderMonthChip('monthChipHolder', (ym) => { CURRENT_MONTH = ym; load(); });
    [allKafalat, allPeople] = await Promise.all([fetchKafalat(), fetchPeople()]);
    renderCollectorTabs();
    await loadMonth();
    setCloudStatus('ok', '☁️ متصل');
    firebaseReady = true;
    const mRef = ref(`months/${CURRENT_MONTH}/collection`);
    mRef.on('value', snap => {
      if (syncingFromCloud) return;
      const val = snap.val();
      if (val) { state = val; renderList(); renderProgress(); }
    });
  } catch(e) {
    setCloudStatus('offline', '✗ خطأ: ' + e.message);
    console.error(e);
  }
}

// Month switching handled by Smart Month Chip in topbar

async function loadMonth() {
  const snap = await ref(`months/${CURRENT_MONTH}/collection`).once('value');
  state = snap.val() || {};
  renderCollectorTabs();
  renderList();
  renderProgress();
}

// Determine PT collector
function getPtCollector(ptId) {
  const p = allPeople[ptId];
  return (p && p.collector) || 'nashwa'; // default to nashwa if unset
}

function getPTData(forceAll=false) {
  const ptMap = {};
  Object.values(allKafalat).forEach(k => {
    if (k.status !== 'active') return;
    (k.funding || []).forEach(f => {
      if (f.source !== 'kafeel' || !f.pt_id) return;
      const ptId = f.pt_id;
      const kId = f.kafeel_id;
      if (!ptMap[ptId]) ptMap[ptId] = {pt_id: ptId, kafeels: {}};
      if (!ptMap[ptId].kafeels[kId]) ptMap[ptId].kafeels[kId] = {kafeel_id: kId, kafalat: [], amount: 0, prepaid_through: null};
      ptMap[ptId].kafeels[kId].kafalat.push({kafala: k, funding: f});
      ptMap[ptId].kafeels[kId].amount += f.amount || 0;
      if (f.prepaid_through && (!ptMap[ptId].kafeels[kId].prepaid_through || f.prepaid_through > ptMap[ptId].kafeels[kId].prepaid_through)) {
        ptMap[ptId].kafeels[kId].prepaid_through = f.prepaid_through;
      }
    });
  });

  let items = Object.values(ptMap).map(pt => {
    const person = allPeople[pt.pt_id] || {name: '?'};
    const kafeelList = Object.values(pt.kafeels);
    return {
      ...pt,
      name: person.name,
      collector: getPtCollector(pt.pt_id),
      total: kafeelList.reduce((s,k) => s+k.amount, 0),
      kafeel_list: kafeelList,
      // SINGLE mode: PT has only himself as kafeel
      is_single: kafeelList.length === 1 && kafeelList[0].kafeel_id === pt.pt_id
    };
  });

  // Apply collector filter
  if (!forceAll && collectorFilter !== 'all') {
    items = items.filter(pt => pt.collector === collectorFilter);
  }

  return items.sort((a,b) => a.name.localeCompare(b.name));
}

function renderCollectorTabs() {
  const all = getPTData(true);
  const nashwa = all.filter(p => p.collector === 'nashwa');
  const youssef = all.filter(p => p.collector === 'youssef');
  document.getElementById('collectorTabs').innerHTML = `
    <button class="collector-tab ${collectorFilter==='all'?'active':''}" onclick="setCollector('all')">
      الكل <span class="cnt">(${all.length})</span>
    </button>
    <button class="collector-tab ${collectorFilter==='nashwa'?'active':''}" onclick="setCollector('nashwa')">
      نشوى <span class="cnt">(${nashwa.length})</span>
    </button>
    <button class="collector-tab ${collectorFilter==='youssef'?'active':''}" onclick="setCollector('youssef')">
      يوسف <span class="cnt">(${youssef.length})</span>
    </button>
  `;
}

function setCollector(c) {
  collectorFilter = c;
  renderCollectorTabs();
  renderList();
  renderProgress();
}

function setFilter(f) {
  statusFilter = f;
  document.querySelectorAll('.fc').forEach(b => b.classList.toggle('active', b.dataset.filter === f));
  renderList();
}

function getPtStatus(pt) {
  const paidCount = pt.kafeel_list.filter(k => getKafeelStatus(pt.pt_id, k.kafeel_id, k) === 'paid').length;
  const prepaidCount = pt.kafeel_list.filter(k => isKafeelPrepaid(k)).length;
  const total = pt.kafeel_list.length;
  if (prepaidCount === total) return 'prepaid';
  if (paidCount + prepaidCount === total) return 'paid';
  if (paidCount > 0) return 'partial';
  return 'unpaid';
}

function isKafeelPrepaid(kafeel) {
  return kafeel.prepaid_through && kafeel.prepaid_through >= CURRENT_MONTH;
}

function getKafeelStatus(ptId, kafeelId, kafeelData) {
  if (isKafeelPrepaid(kafeelData)) return 'prepaid';
  const entry = state[ptId] && state[ptId].kafeel_payments && state[ptId].kafeel_payments[kafeelId];
  if (!entry) return 'pending';
  return entry.status;
}

function renderProgress() {
  const pts = getPTData();
  const total = pts.length;
  let paid = 0, prepaid = 0, remain = 0;
  let collectedAmount = 0, totalAmount = 0;
  pts.forEach(pt => {
    totalAmount += pt.total;
    const st = getPtStatus(pt);
    if (st === 'paid' || st === 'prepaid') { paid++; collectedAmount += pt.total; }
    if (st === 'prepaid') prepaid++;
    if (st !== 'paid' && st !== 'prepaid') remain++;
  });
  const pct = total ? Math.round((paid / total) * 100) : 0;

  const collectorLbl = collectorFilter === 'all' ? '' : ` (${collectorFilter === 'youssef' ? 'يوسف' : 'نشوى'})`;
  document.getElementById('progressTitle').textContent = `${arabicMonth(CURRENT_MONTH)}${collectorLbl}`;
  document.getElementById('progressMain').textContent = `${fmt(collectedAmount)} / ${fmt(totalAmount)} جنيه`;
  document.getElementById('progressFill').style.width = pct + '%';
  document.getElementById('statAll').textContent = total;
  document.getElementById('statRemain').textContent = remain;
  document.getElementById('statDone').textContent = paid - prepaid;
  document.getElementById('statPrepaid').textContent = prepaid;
}

function normalize(s) { return (s||'').toLowerCase().trim(); }

function ptMatchesSearch(pt, q) {
  if (!q) return true;
  const qn = normalize(q);
  // Match PT name
  if (normalize(pt.name).includes(qn)) return true;
  // Match any kafeel name
  for (const k of pt.kafeel_list) {
    const kName = (allPeople[k.kafeel_id]||{}).name || '';
    if (normalize(kName).includes(qn)) return true;
    // Match child or guardian
    for (const {kafala} of k.kafalat) {
      if (normalize(kafala.child).includes(qn)) return true;
      const g = (allPeople[kafala.guardian_id]||{}).name || '';
      if (normalize(g).includes(qn)) return true;
    }
  }
  return false;
}

function renderList() {
  const q = document.getElementById('search').value.trim();
  let pts = getPTData();

  // Apply status filter
  if (statusFilter !== 'all') {
    pts = pts.filter(p => getPtStatus(p) === statusFilter);
  }

  // Apply search
  if (q) pts = pts.filter(pt => ptMatchesSearch(pt, q));

  if (pts.length === 0) {
    document.getElementById('ptList').innerHTML = `<div style="text-align:center;padding:40px;color:var(--muted)">
      لا نتائج ${q ? `لـ "${q}"` : ''}
    </div>`;
    return;
  }

  document.getElementById('ptList').innerHTML = pts.map(pt => renderPt(pt)).join('');

  // Show submit if any paid
  const anyPaid = Object.values(state).some(s => (s||{}).overall_status === 'paid' || (s||{}).overall_status === 'partial');
  if (anyPaid) document.getElementById('submitBtn').classList.add('show');
}

// Export filtered collection view as CSV (per-kafeel rows)
function exportCollectionFiltered() {
  const q = document.getElementById('search').value.trim();
  let pts = getPTData();
  if (collectorFilter) pts = pts.filter(pt => pt.collector === collectorFilter);
  if (statusFilter !== 'all') pts = pts.filter(p => getPtStatus(p) === statusFilter);
  if (q) pts = pts.filter(pt => ptMatchesSearch(pt, q));

  if (!pts.length) return toast('لا نتائج للتصدير', 'error');

  const rows = [['المحصّل','PT','الكفيل','الطفل','ولي الأمر','المنطقة','المبلغ','الحالة','مدفوع مقدماً حتى','ملاحظات']];
  let total = 0, paid = 0;

  pts.forEach(pt => {
    (pt.kafeel_list||[]).forEach(k => {
      const st = isKafeelPrepaid(k) ? 'مقدماً' :
                 getKafeelStatus(pt.pt_id, k.kafeel_id, k) === 'paid' ? 'مدفوع' : 'غير مدفوع';
      total += k.amount || 0;
      if (st !== 'غير مدفوع') paid += k.amount || 0;
      rows.push([
        pt.collector === 'youssef' ? 'يوسف' : 'نشوى',
        pt.pt_name || '',
        k.kafeel_name || '',
        k.child_name || '',
        k.guardian_name || '',
        (k.area||'').replace(/_/g,' '),
        k.amount || 0,
        st,
        k.prepaid_through || '',
        k.notes || ''
      ]);
    });
  });

  rows.push([]);
  rows.push(['','','','','','المجموع:', total, '', '', '']);
  rows.push(['','','','','','المحصّل:', paid, '', '', '']);
  rows.push(['','','','','','المتبقي:', total - paid, '', '', '']);

  const csv = '﻿' + rows.map(r =>
    r.map(c => {
      const s = String(c ?? '');
      return /[",\n]/.test(s) ? '"' + s.replace(/"/g,'""') + '"' : s;
    }).join(',')
  ).join('\n');

  const label = [
    collectorFilter ? (collectorFilter === 'youssef' ? 'يوسف' : 'نشوى') : 'الكل',
    statusFilter !== 'all' ? statusFilter : '',
    q ? 'بحث-' + q : ''
  ].filter(x=>x).join('_');

  const blob = new Blob([csv], {type:'text/csv;charset=utf-8;'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `تحصيل_${label}_${CURRENT_MONTH}.csv`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);

  toast(`✓ تم تصدير ${rows.length - 5} صف`, 'success');
}

function renderPt(pt) {
  const st = getPtStatus(pt);
  const singleMode = pt.is_single;
  const collectorBadge = `<span class="pt-sub">${pt.collector === 'youssef' ? '🧑‍💼 يوسف' : '👩 نشوى'}${singleMode ? '' : ` • ${pt.kafeel_list.length} كفيل`}</span>`;

  // SINGLE mode: PT is own only kafeel → the PT row IS the kafeel row with everything inline
  if (singleMode) {
    const k = pt.kafeel_list[0];
    return renderUnifiedRow(pt, k);
  }

  // NESTED mode — collapsible header + kafeel rows inside
  // Status badge in header: green "✓ الكل مدفوع" if all paid
  const paidCount = pt.kafeel_list.filter(k => {
    if (isKafeelPrepaid(k)) return true;
    return getKafeelStatus(pt.pt_id, k.kafeel_id, k) === 'paid';
  }).length;
  const totalKafeels = pt.kafeel_list.length;
  const allPaid = paidCount === totalKafeels;
  const cardClass = allPaid ? 'all-paid' : '';

  let headerStatus;
  if (allPaid) {
    headerStatus = `<span style="background:var(--success);color:#fff;padding:3px 10px;border-radius:12px;font-size:11px;font-weight:700">✓ الكل مدفوع</span>`;
  } else if (paidCount > 0) {
    headerStatus = `<span style="background:var(--gold);color:var(--ink);padding:3px 10px;border-radius:12px;font-size:11px;font-weight:700">${paidCount}/${totalKafeels}</span>`;
  } else {
    headerStatus = `<span style="background:var(--cream-deep);color:var(--muted);padding:3px 10px;border-radius:12px;font-size:11px;font-weight:700">0/${totalKafeels}</span>`;
  }

  return `<div class="pt-card ${cardClass}" data-pt="${pt.pt_id}">
    <div class="pt-header" onclick="togglePt('${pt.pt_id}')">
      <div class="pt-indicator ${st}"></div>
      <div class="pt-name">
        ${pt.name}
        ${collectorBadge}
      </div>
      ${headerStatus}
      <div class="pt-amount"><b>${fmt(pt.total)}</b> جنيه</div>
      <div class="pt-chevron">▼</div>
    </div>
    <div class="pt-body">
      ${pt.kafeel_list.map(k => renderKafeelRow(pt.pt_id, k, false)).join('')}
    </div>
  </div>`;
}

// Single unified row for PTs who are their own only kafeel — no nesting, no duplication
function renderUnifiedRow(pt, kafeel) {
  const status = getKafeelStatus(pt.pt_id, kafeel.kafeel_id, kafeel);
  const prepaid = isKafeelPrepaid(kafeel);

  const children = kafeel.kafalat
    .map(({kafala}) => kafala.child)
    .filter(c => c && c !== 'nan' && c !== 'NaN');
  const uniqueChildren = [...new Set(children)];
  const details = uniqueChildren.join('، ');

  // Build the paid button HTML
  let paidBtn;
  if (prepaid) {
    paidBtn = `<button class="paid-btn prepaid" disabled>📅 ${arabicMonth(kafeel.prepaid_through).split(' ')[0]}</button>`;
  } else if (status === 'paid') {
    paidBtn = `<button class="paid-btn paid" onclick="toggleKafeel('${pt.pt_id}','${kafeel.kafeel_id}')">✓ مدفوع</button>`;
  } else {
    paidBtn = `<button class="paid-btn" onclick="toggleKafeel('${pt.pt_id}','${kafeel.kafeel_id}')">دفع</button>`;
  }

  const prepaidOpts = buildPrepaidOpts(kafeel.prepaid_through);
  const noteVal = (state[pt.pt_id]?.kafeel_payments?.[kafeel.kafeel_id]?.note) || '';
  const hasNote = noteVal.length > 0;
  const detailLine = prepaid
    ? `مدفوع حتى ${arabicMonth(kafeel.prepaid_through)}${details ? ` · ${details}` : ''}`
    : details;

  const collectorIcon = pt.collector === 'youssef' ? '🧑‍💼' : '👩';
  const cardClass = status === 'paid' || prepaid ? 'all-paid' : '';

  return `<div class="pt-card unified ${cardClass}" data-pt="${pt.pt_id}">
    <div class="unified-row">
      <div class="unified-info">
        <div class="unified-name">${pt.name} <span class="unified-sub">${collectorIcon}</span></div>
        ${detailLine ? `<div class="unified-detail">${detailLine}</div>` : ''}
      </div>
      ${paidBtn}
      <select class="prepaid-select" onchange="setPrepaidInline('${pt.pt_id}','${kafeel.kafeel_id}', this.value)" title="دفع مقدماً حتى">${prepaidOpts}</select>
      <div class="unified-amount"><b>${fmt(kafeel.amount)}</b> جنيه</div>
      <button class="notes-btn ${hasNote?'active':''}" onclick="toggleUnifiedNotes(this)" title="ملاحظات">${hasNote?'📝':'📄'}</button>
    </div>
    <div class="unified-notes">
      <textarea placeholder="ملاحظات..." oninput="updateKafeelNote('${pt.pt_id}','${kafeel.kafeel_id}', this.value)">${noteVal}</textarea>
    </div>
  </div>`;
}

function buildPrepaidOpts(current) {
  const [y, m] = CURRENT_MONTH.split('-').map(Number);
  let opts = `<option value="">📅 —</option>`;
  for (let i = 1; i <= 13; i++) {
    const d = new Date(y, m - 1 + i, 1);
    const ym = `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`;
    const sel = current === ym ? 'selected' : '';
    opts += `<option value="${ym}" ${sel}>${arabicMonth(ym)}</option>`;
  }
  return opts;
}

function toggleUnifiedNotes(btn) {
  btn.closest('.pt-card').classList.toggle('notes-open');
}

function renderKafeelRow(ptId, kafeel, isSingle) {
  const name = (allPeople[kafeel.kafeel_id]||{}).name || '?';
  const status = getKafeelStatus(ptId, kafeel.kafeel_id, kafeel);
  const prepaid = isKafeelPrepaid(kafeel);

  // Build details - filter out "nan" and duplicates
  const children = kafeel.kafalat
    .map(({kafala}) => kafala.child)
    .filter(c => c && c !== 'nan' && c !== 'NaN');
  const uniqueChildren = [...new Set(children)];
  const details = uniqueChildren.join('، ');

  let checkClass = '', checkIcon = '';
  if (prepaid) { checkClass = 'prepaid'; checkIcon = '📅'; }
  else if (status === 'paid') { checkClass = 'paid'; checkIcon = '✓'; }
  else if (status === 'unpaid') { checkClass = 'unpaid'; checkIcon = '✗'; }

  // Prepaid picker options: next 13 months
  const [y, m] = CURRENT_MONTH.split('-').map(Number);
  let prepaidOpts = `<option value="">— الشهر الحالي —</option>`;
  for (let i = 1; i <= 13; i++) {
    const d = new Date(y, m - 1 + i, 1);
    const ym = `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`;
    const selected = kafeel.prepaid_through === ym ? 'selected' : '';
    prepaidOpts += `<option value="${ym}" ${selected}>${arabicMonth(ym)}</option>`;
  }

  // Get saved note
  const noteVal = (state[ptId] && state[ptId].kafeel_payments && state[ptId].kafeel_payments[kafeel.kafeel_id] && state[ptId].kafeel_payments[kafeel.kafeel_id].note) || '';
  const hasNote = noteVal.length > 0;

  const detailLine = prepaid
    ? `مدفوع حتى ${arabicMonth(kafeel.prepaid_through)}${details ? ` · ${details}` : ''}`
    : (details || (isSingle ? '' : 'بدون تفاصيل'));

  // Build paid button
  let paidBtn;
  if (prepaid) {
    paidBtn = `<button class="paid-btn prepaid kafeel-paid-btn" disabled>📅 ${arabicMonth(kafeel.prepaid_through).split(' ')[0]}</button>`;
  } else if (status === 'paid') {
    paidBtn = `<button class="paid-btn paid kafeel-paid-btn" onclick="toggleKafeel('${ptId}','${kafeel.kafeel_id}')">✓ مدفوع</button>`;
  } else {
    paidBtn = `<button class="paid-btn kafeel-paid-btn" onclick="toggleKafeel('${ptId}','${kafeel.kafeel_id}')">دفع</button>`;
  }

  const rowClass = status === 'paid' || prepaid ? 'paid-row' : '';

  return `<div class="kafeel-row ${rowClass}" data-kafeel="${kafeel.kafeel_id}">
    <div class="kafeel-info">
      <div class="kafeel-name">${name}</div>
      ${detailLine ? `<div class="kafeel-detail">${detailLine}</div>` : ''}
    </div>
    ${paidBtn}
    <select class="prepaid-select kafeel-prepaid" onchange="setPrepaidInline('${ptId}','${kafeel.kafeel_id}', this.value)" title="دفع مقدماً حتى">
      ${prepaidOpts}
    </select>
    <div class="kafeel-amount">${fmt(kafeel.amount)}</div>
    <button class="notes-btn ${hasNote ? 'active' : ''}" onclick="toggleNotes(this)" title="ملاحظات">${hasNote ? '📝' : '📄'}</button>
    <div class="kafeel-notes-box">
      <textarea placeholder="ملاحظات لهذا الكفيل..." oninput="updateKafeelNote('${ptId}','${kafeel.kafeel_id}', this.value)">${noteVal}</textarea>
    </div>
  </div>`;
}

function togglePt(ptId) {
  const card = document.querySelector(`[data-pt="${ptId}"]`);
  card.classList.toggle('expanded');
}

function toggleNotes(btn) {
  btn.closest('.kafeel-row').classList.toggle('notes-open');
}

async function setPrepaidInline(ptId, kafeelId, value) {
  if (!value) return; // user chose "current month only"
  const ok = confirm(`تأكيد: ${(allPeople[kafeelId]||{}).name} دفع مقدماً حتى ${arabicMonth(value)}؟`);
  if (!ok) { renderList(); return; }
  await applyPrepaidToFirebase(kafeelId, value);
  // Mark as paid in state too
  if (!state[ptId]) state[ptId] = {kafeel_payments: {}};
  if (!state[ptId].kafeel_payments) state[ptId].kafeel_payments = {};
  state[ptId].kafeel_payments[kafeelId] = {status: 'paid', paid_at: Date.now(), prepaid_through: value};
  save();
  bumpInteraction();
  renderList();
  renderProgress();
}

async function applyPrepaidToFirebase(kafeelId, prepaidThrough) {
  let count = 0;
  for (const [kid, k] of Object.entries(allKafalat)) {
    if (k.status !== 'active') continue;
    let changed = false;
    const funding = (k.funding || []).map(f => {
      if (f.source === 'kafeel' && f.kafeel_id === kafeelId) {
        changed = true;
        return {...f, prepaid_through: prepaidThrough};
      }
      return f;
    });
    if (changed) {
      await ref(`kafalat/${kid}/funding`).set(funding);
      await ref(`kafalat/${kid}/updated_at`).set(Date.now());
      allKafalat[kid].funding = funding;
      count++;
    }
  }
  if (count) toast(`✓ مدفوع مقدماً حتى ${arabicMonth(prepaidThrough)} لـ ${count} كفالة`, 'success');
}

async function toggleKafeel(ptId, kafeelId) {
  const pt = getPTData(true).find(p => p.pt_id === ptId);
  if (!pt) return;
  const kafeel = pt.kafeel_list.find(k => k.kafeel_id === kafeelId);
  if (!kafeel || isKafeelPrepaid(kafeel)) return;

  const current = getKafeelStatus(ptId, kafeelId, kafeel);
  const next = current === 'paid' ? 'unpaid' : current === 'unpaid' ? 'pending' : 'paid';

  if (next === 'paid') {
    const name = (allPeople[kafeelId]||{}).name || '?';
    const ok = confirm(`تأكيد استلام ${fmt(kafeel.amount)} جنيه من ${name}؟`);
    if (!ok) return;
  }

  if (!state[ptId]) state[ptId] = {kafeel_payments: {}};
  if (!state[ptId].kafeel_payments) state[ptId].kafeel_payments = {};
  if (next === 'pending') delete state[ptId].kafeel_payments[kafeelId];
  else state[ptId].kafeel_payments[kafeelId] = {status: next, paid_at: Date.now()};

  const allPaid = pt.kafeel_list.every(k => {
    if (isKafeelPrepaid(k)) return true;
    const e = state[ptId].kafeel_payments[k.kafeel_id];
    return e && e.status === 'paid';
  });
  state[ptId].overall_status = allPaid ? 'paid' : 'partial';

  bumpInteraction();
  renderList();
  renderProgress();
  save();

  setTimeout(() => {
    const card = document.querySelector(`[data-pt="${ptId}"]`);
    if (card && !card.classList.contains('single')) card.classList.add('expanded');
    document.getElementById('submitBtn').classList.add('show');
  }, 50);
}

function updateKafeelNote(ptId, kafeelId, val) {
  if (!state[ptId]) state[ptId] = {kafeel_payments: {}};
  if (!state[ptId].kafeel_payments) state[ptId].kafeel_payments = {};
  if (!state[ptId].kafeel_payments[kafeelId]) {
    state[ptId].kafeel_payments[kafeelId] = {status: 'pending'};
  }
  state[ptId].kafeel_payments[kafeelId].note = val;
  save();
}

function bumpInteraction() {
  interactionCount++;
  if (interactionCount % SALAWAT_POPUP_EVERY === 0) showSalawatPopup();
}

function showSalawatPopup() {
  const popup = document.createElement('div');
  popup.className = 'salawat-popup';
  popup.innerHTML = `<div class="inner">
    <div class="icon">🌿</div>
    <div class="text">${SALAWAT[Math.floor(Math.random()*SALAWAT.length)]}</div>
    <div class="dismiss">اضغطي في أي مكان للإغلاق</div>
  </div>`;
  document.body.appendChild(popup);
  popup.onclick = () => popup.remove();
  setTimeout(() => { if (popup.parentNode) popup.remove(); }, 4500);
}

let offlineBanner = null;
function showOffline() {
  if (offlineBanner) return;
  offlineBanner = document.createElement('div');
  offlineBanner.className = 'offline-banner';
  offlineBanner.textContent = '⚠️ لا يوجد اتصال - التحديثات لن تُحفظ';
  document.body.appendChild(offlineBanner);
}
function hideOffline() { if (offlineBanner) { offlineBanner.remove(); offlineBanner = null; } }
window.addEventListener('online', hideOffline);
window.addEventListener('offline', showOffline);
if (!navigator.onLine) showOffline();

function submitProgress() {
  const pts = getPTData(true);
  let paidTotal = 0, paidCount = 0;
  const paidList = [];
  pts.forEach(pt => {
    const paidKafeels = pt.kafeel_list.filter(k => {
      if (isKafeelPrepaid(k)) return false;
      return getKafeelStatus(pt.pt_id, k.kafeel_id, k) === 'paid';
    });
    if (paidKafeels.length) {
      const amt = paidKafeels.reduce((s,k) => s + k.amount, 0);
      paidTotal += amt; paidCount += paidKafeels.length;
      paidList.push(`• ${pt.name}: ${fmt(amt)} جنيه`);
    }
  });

  const msg = `*التقدم في التحصيل - ${arabicMonth(CURRENT_MONTH)}*\n\nتم تحصيل ${fmt(paidTotal)} جنيه من ${paidCount} كفيل:\n\n${paidList.join('\n')}\n\nجزاكم الله خيراً 🌸`;

  const bg = document.createElement('div');
  bg.className = 'modal-bg';
  bg.innerHTML = `<div class="modal">
    <h3 style="margin-top:0">📨 رسالة التقدم</h3>
    <div style="background:#fdfbf5;border:1px solid var(--gold-light);border-radius:10px;padding:14px;white-space:pre-wrap;font-size:13px;max-height:50vh;overflow:auto" id="_pm">${msg}</div>
    <div class="modal-actions">
      <button class="btn-gold" id="_cpy2">📋 نسخ</button>
      <button class="btn-ghost" id="_cls2">إغلاق</button>
    </div></div>`;
  document.body.appendChild(bg);
  bg.querySelector('#_cpy2').onclick = () => { navigator.clipboard.writeText(msg); toast('✓ نُسخ', 'success'); bg.remove(); };
  bg.querySelector('#_cls2').onclick = () => bg.remove();
}

function save() {
  setCloudStatus('saving', '⏳ جاري الحفظ...');
  if (saveTimer) clearTimeout(saveTimer);
  saveTimer = setTimeout(async () => {
    if (!firebaseReady) { setCloudStatus('offline', '✗ محفوظ محلياً'); return; }
    try {
      syncingFromCloud = true;
      await ref(`months/${CURRENT_MONTH}/collection`).set(state);
      await ref(`months/${CURRENT_MONTH}/last_update`).set(Date.now());
      setCloudStatus('ok', '✓ محفوظ');
      setTimeout(() => { syncingFromCloud = false; }, 200);
    } catch(e) {
      setCloudStatus('offline', '✗ فشل الحفظ');
      syncingFromCloud = false;
    }
  }, 500);
}

load();
</script>
</body>
</html>
