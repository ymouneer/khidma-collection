<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta http-equiv="refresh" content="0; url=V2/home.html">
<title>نظام خدمة — تحويل</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Ctext x='0' y='14' font-size='14'%3E🌿%3C/text%3E%3C/svg%3E">
<style>
  body {
    font-family: -apple-system, 'Segoe UI', Tahoma, sans-serif;
    background: linear-gradient(180deg, #e8f0eb 0%, #faf7f0 100%);
    display: flex; align-items: center; justify-content: center;
    min-height: 100vh; margin: 0; color: #1a2c23;
  }
  .card {
    background: #fff; padding: 40px 32px; border-radius: 16px;
    box-shadow: 0 8px 24px rgba(10,26,20,0.08);
    text-align: center; max-width: 420px;
  }
  .leaf { font-size: 44px; margin-bottom: 14px; }
  h1 { color: #1b4332; margin: 0 0 8px; font-size: 22px; }
  p { color: #5a6b62; margin: 8px 0; line-height: 1.6; font-size: 14px; }
  a {
    display: inline-block; margin-top: 18px; padding: 12px 28px;
    background: #1b4332; color: #fff; text-decoration: none;
    border-radius: 10px; font-weight: 600;
  }
  a:hover { background: #2d6a4f; }
  .dot { display: inline-block; width: 8px; height: 8px; background: #c9a86a; border-radius: 50%; animation: pulse 1s infinite; margin: 0 2px; }
  .dot:nth-child(2) { animation-delay: 0.2s; }
  .dot:nth-child(3) { animation-delay: 0.4s; }
  @keyframes pulse { 0%, 100% { opacity: 0.3; } 50% { opacity: 1; } }
</style>
</head>
<body>
<div class="card">
  <div class="leaf">🌿</div>
  <h1>نظام خدمة — V2</h1>
  <p>النسخة القديمة لم تعد مستخدمة.</p>
  <p>جاري التحويل للنسخة الجديدة <span class="dot"></span><span class="dot"></span><span class="dot"></span></p>
  <a href="V2/home.html">افتح V2 الآن ←</a>
</div>
<script>
  // Hard redirect after 1s if meta refresh didn't fire
  setTimeout(() => { window.location.replace('V2/home.html'); }, 1000);
</script>
</body>
</html>
