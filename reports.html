<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>الأرشيف والتقارير — v2</title>
<link rel="stylesheet" href="style.css">
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
<style>
  .hero-controls {
    background: linear-gradient(135deg, var(--cream) 0%, var(--cream-deep) 100%);
    border-radius: var(--r-lg); padding: 20px 24px;
    margin-bottom: 20px; box-shadow: var(--shadow-sm);
    border: 1px solid var(--border-light);
  }
  .hero-controls h2 {
    margin: 0 0 4px; color: var(--accent); font-size: 18px; font-weight: 700;
  }
  .hero-controls .sub {
    color: var(--muted); font-size: 12.5px; margin-bottom: 14px;
  }
  .month-row {
    display: flex; gap: 10px; align-items: center; flex-wrap: wrap;
  }
  .month-row label {
    font-size: 12px; color: var(--muted); font-weight: 600;
  }
  .month-select {
    padding: 10px 14px; border-radius: var(--r-sm); border: 1px solid var(--border);
    font-size: 14px; background: #fff; min-width: 260px; cursor: pointer;
    font-family: inherit;
  }
  .month-select:focus { border-color: var(--accent); outline: none; }

  .mode-tabs {
    display: inline-flex; background: #fff; padding: 3px;
    border-radius: 20px; border: 1px solid var(--border-light);
    gap: 3px;
  }
  .mode-tab {
    background: transparent; border: none; padding: 7px 18px;
    border-radius: 16px; cursor: pointer; font-size: 13px;
    color: var(--muted); font-weight: 600;
  }
  .mode-tab.active { background: var(--accent); color: #fff; }

  .month-badge {
    padding: 3px 10px; border-radius: 10px; font-size: 11.5px;
    font-weight: 700;
  }
  .month-badge.closed { background: var(--accent-ultra-light); color: var(--accent); }
  .month-badge.draft  { background: #fdf7e3; color: #6d4e00; }
  .month-badge.empty  { background: #f2f3f0; color: var(--muted); }

  .report-grid {
    display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr));
    gap: 12px; margin-top: 14px;
  }
  .report-tile {
    background: #fff; border: 1px solid var(--border-light); border-radius: var(--r);
    padding: 16px; display: flex; flex-direction: column; gap: 8px;
    box-shadow: var(--shadow-sm); transition: all var(--t-fast);
  }
  .report-tile:hover { box-shadow: var(--shadow); transform: translateY(-2px); }
  .report-tile h4 { margin: 0; color: var(--accent); font-size: 14px; }
  .report-tile .amt { font-size: 22px; font-weight: 800; color: var(--accent); font-family: var(--font-mono, inherit); }
  .report-tile .sub { font-size: 11.5px; color: var(--muted); }
  .report-tile.msg { background: linear-gradient(135deg, #fdfbf5 0%, #fff 100%); }
  .report-tile .actions { display: flex; gap: 6px; margin-top: auto; }

  .report-preview {
    background: #fff; border: 1px solid var(--border); border-radius: var(--r);
    padding: 24px; margin-top: 18px; box-shadow: var(--shadow-sm);
  }
  .report-preview h2 { margin: 0 0 6px; color: var(--accent); font-size: 20px; }

  .excl-check {
    display: inline-flex; width: 22px; height: 22px;
    border: 2px solid var(--border); border-radius: 4px;
    background: #fff; cursor: pointer;
    align-items: center; justify-content: center;
    font-size: 14px; font-weight: 700;
  }
  .excl-check.checked { border-color: #d9534f; background: #d9534f; color: #fff; }
  .guardian-group-row.excluded { opacity: 0.35; background: #f3f4f0 !important; }
  .guardian-group-row.excluded td { text-decoration: line-through; }
  .excl-toolbar {
    display: flex; gap: 10px; margin-bottom: 10px; padding: 10px 14px;
    background: var(--cream-deep); border-radius: var(--r-sm);
    align-items: center; font-size: 13px;
  }
  .msg-box {
    background: #fdfbf5; border: 1px solid var(--border-light);
    border-radius: var(--r); padding: 18px;
    font-family: inherit; white-space: pre-wrap;
    font-size: 13.5px; line-height: 1.8; margin-top: 10px;
  }

  /* Comparison mode */
  .cmp-months {
    display: flex; gap: 6px; flex-wrap: wrap; align-items: center;
    padding: 12px; background: var(--cream); border-radius: var(--r-sm);
    margin-bottom: 14px;
  }
  .cmp-chip {
    padding: 6px 12px; background: #fff; border: 1px solid var(--border);
    border-radius: 16px; font-size: 12.5px; cursor: pointer; font-weight: 600;
  }
  .cmp-chip.selected { background: var(--accent); color: #fff; border-color: var(--accent); }
  .cmp-chip:hover { border-color: var(--accent); }
  .cmp-chip .dot { font-size: 10px; margin-left: 4px; opacity: 0.7; }

  .cmp-table {
    width: 100%; border-collapse: separate; border-spacing: 0;
    margin-top: 10px;
  }
  .cmp-table th, .cmp-table td {
    padding: 10px 12px; text-align: center; border-bottom: 1px solid var(--border-light);
  }
  .cmp-table th {
    background: var(--accent); color: #fff; font-weight: 700; font-size: 12.5px;
  }
  .cmp-table th:first-child, .cmp-table td:first-child { text-align: right; }
  .cmp-table tbody tr:hover { background: var(--cream); }
  .cmp-table .total-row {
    background: var(--cream-deep); font-weight: 800;
  }
  .trend-up    { color: var(--success); font-weight: 700; }
  .trend-down  { color: var(--danger,#d9534f); font-weight: 700; }
  .trend-flat  { color: var(--muted); }

  .empty-state {
    text-align: center; padding: 50px 20px; color: var(--muted-light);
    font-size: 14px;
  }

  @media print {
    .no-print, .excl-check, .excl-toolbar, .hero-controls { display: none !important; }
    .guardian-group-row.excluded { display: none !important; }
  }
</style>
</head>
<body>

<div class="topbar no-print">
  <h1>📄 الأرشيف والتقارير</h1>
  <div class="right">
    <a href="home.html">🏠 الرئيسية</a>
    <a href="closure.html" class="hide-mobile">إقفال الشهر الحالي</a>
    <a href="admin.html" class="hide-mobile">إدارة</a>
    <a onclick="createFullBackup()" class="btn-backup">💾 Backup</a>
    <span class="logout" onclick="logout()">خروج</span>
  </div>
</div>

<div class="container">

  <!-- CONTROLS HERO -->
  <div class="hero-controls no-print">
    <h2>📊 أرشيف شهور الكفالات</h2>
    <div class="sub">استعرض تقارير و رسائل أي شهر سابق، أو قارن بين عدة شهور للرؤية الأعمق.</div>

    <div class="month-row">
      <div class="mode-tabs">
        <button class="mode-tab active" id="tabSingle" onclick="setMode('single')">🔍 عرض شهر</button>
        <button class="mode-tab" id="tabCompare" onclick="setMode('compare')">📊 مقارنة بين شهور</button>
      </div>

      <div class="spacer"></div>

      <div id="singleControls" style="display:flex;gap:10px;align-items:center;flex-wrap:wrap">
        <label>الشهر:</label>
        <select class="month-select" id="monthSelect" onchange="onPickMonth()"></select>
        <span id="monthStatusBadge"></span>
      </div>
    </div>
  </div>

  <!-- SINGLE MODE: tiles + preview -->
  <div id="singleMode">
    <div id="tileGrid" class="report-grid"></div>
    <div id="previewArea"></div>
  </div>

  <!-- COMPARE MODE: chip picker + compare table -->
  <div id="compareMode" style="display:none">
    <div class="card">
      <h3 style="margin:0 0 10px">اختر الشهور للمقارنة (٢ أو أكثر)</h3>
      <div class="cmp-months" id="cmpChips"></div>
      <div id="cmpResult"></div>
    </div>
  </div>

</div>

<script src="config.js"></script>
<script>
if (!checkAuth()) throw new Error('auth');
initFirebase();

let allMonthsData = {};    // {ym: {status, closure_state, totals, snapshot, ...}}
let liveKafalat = {}, livePeople = {}; // for draft fallback
let selectedMonth = null;
let compareSet = new Set();
let mode = 'single';

async function loadAll() {
  // Fetch every month record (we only expect ~12-24 of these)
  const [mSnap, people, kafalat] = await Promise.all([
    ref('months').once('value'),
    fetchPeople(),
    fetchKafalat()
  ]);
  allMonthsData = mSnap.val() || {};
  livePeople = people;
  liveKafalat = kafalat;

  // Also include an entry for the current working month even if no record saved (live preview)
  const now = getWorkingMonth();
  if (!allMonthsData[now]) allMonthsData[now] = {status:'empty'};

  populateMonthSelect();

  // Default: latest closed; else latest with any data; else current
  const months = Object.keys(allMonthsData).sort().reverse();
  const defaultMonth = months.find(m => allMonthsData[m].status === 'closed')
                    || months.find(m => allMonthsData[m].status === 'draft')
                    || months[0]
                    || now;

  selectedMonth = defaultMonth;
  document.getElementById('monthSelect').value = defaultMonth;
  render();
}

function monthStatusLabel(m) {
  const d = allMonthsData[m] || {};
  if (d.status === 'closed') return {t: '✓ مقفل', cls: 'closed'};
  if (d.status === 'draft')  return {t: '📝 مسودة', cls: 'draft'};
  return {t: '— بدون بيانات', cls: 'empty'};
}

function populateMonthSelect() {
  const sel = document.getElementById('monthSelect');
  const months = Object.keys(allMonthsData).sort().reverse();
  sel.innerHTML = months.map(m => {
    const lbl = monthStatusLabel(m);
    return `<option value="${m}">${arabicMonth(m)} — ${lbl.t}</option>`;
  }).join('');
}

function setMode(m) {
  mode = m;
  document.getElementById('tabSingle').classList.toggle('active', m === 'single');
  document.getElementById('tabCompare').classList.toggle('active', m === 'compare');
  document.getElementById('singleMode').style.display = m === 'single' ? '' : 'none';
  document.getElementById('compareMode').style.display = m === 'compare' ? '' : 'none';
  document.getElementById('singleControls').style.display = m === 'single' ? '' : 'none';
  if (m === 'compare') renderCompare();
}

function onPickMonth() {
  selectedMonth = document.getElementById('monthSelect').value;
  render();
}

function render() {
  if (mode !== 'single') return;
  const lbl = monthStatusLabel(selectedMonth);
  document.getElementById('monthStatusBadge').innerHTML = `<span class="month-badge ${lbl.cls}">${lbl.t}</span>`;
  renderTiles();
}

// Compute totals for a given month — using snapshot if closed, live kafalat for draft/empty (filtered to current state)
function monthTotalsByArea(ym) {
  const data = allMonthsData[ym] || {};
  // If already stored
  if (data.totals && data.totals.by_area) return data.totals.by_area;

  const state = data.closure_state || {};
  const dist = state.zakat_distribution || {};
  const src = data.snapshot?.kafalat || liveKafalat;

  const byArea = {};
  Object.values(src).forEach(k => {
    if (k.status !== 'active') return;
    const a = k.area;
    if (!byArea[a]) byArea[a] = {base: 0, zakat: 0, total: 0};
    (k.funding||[]).forEach(f => {
      if (f.prepaid_through && f.prepaid_through >= ym) return;
      byArea[a].base += f.amount || 0;
    });
  });
  Object.entries(dist).forEach(([gid, amt]) => {
    const kafala = Object.values(src).find(k => k.guardian_id === gid);
    if (!kafala) return;
    if (!byArea[kafala.area]) byArea[kafala.area] = {base: 0, zakat: 0, total: 0};
    byArea[kafala.area].zakat += amt;
  });
  Object.keys(byArea).forEach(a => { byArea[a].total = byArea[a].base + byArea[a].zakat; });
  return byArea;
}

function renderTiles() {
  const byArea = monthTotalsByArea(selectedMonth);
  const areas = ['الصف','كفر_علو','المعصرة','أماكن_أخرى'];
  document.getElementById('tileGrid').innerHTML = `
    ${areas.map(a => `
      <div class="report-tile">
        <h4>📋 ${areaDisplay(a)}</h4>
        <div class="amt">${fmt(byArea[a]?.total||0)} <span style="font-size:13px;color:var(--muted)">ج</span></div>
        <div class="sub">${getExcluded(selectedMonth,a).size ? `${getExcluded(selectedMonth,a).size} مُستثنى` : 'التقرير الكامل'}</div>
        <div class="actions">
          <button class="btn-small" onclick="renderAreaReport('${a}')">معاينة</button>
        </div>
      </div>
    `).join('')}
    <div class="report-tile msg">
      <h4>💬 رسالة نشوى الشهرية</h4>
      <div class="sub">خطة التحويل + بركة الصدقات + الزكاة</div>
      <div class="actions">
        <button class="btn-gold btn-small" onclick="renderNashwaMsg()">عرض ونسخ</button>
      </div>
    </div>
    <div class="report-tile msg">
      <h4>💬 ملخصات المشايخ</h4>
      <div class="sub">رسالة لكل شيخ منطقة</div>
      <div class="actions">
        <button class="btn-gold btn-small" onclick="renderSheikhMsgs()">عرض الكل</button>
      </div>
    </div>
  `;
  document.getElementById('previewArea').innerHTML = '';
}

// Exclusions stored per month + area
function exclKey(ym, area) { return `rpt_excl_${ym}_${area}`; }
function getExcluded(ym, area) {
  try { return new Set(JSON.parse(localStorage.getItem(exclKey(ym,area)) || '[]')); }
  catch(e) { return new Set(); }
}
function setExcluded(ym, area, set) {
  try { localStorage.setItem(exclKey(ym,area), JSON.stringify([...set])); } catch(e) {}
}
function toggleReportExclude(area, gid) {
  const s = getExcluded(selectedMonth, area);
  if (s.has(gid)) s.delete(gid); else s.add(gid);
  setExcluded(selectedMonth, area, s);
  renderAreaReport(area);
  renderTiles();
}
function clearReportExcluded(area) {
  setExcluded(selectedMonth, area, new Set());
  renderAreaReport(area);
  renderTiles();
}

function renderAreaReport(area) {
  const data = allMonthsData[selectedMonth] || {};
  const snapshot = data.snapshot?.kafalat || liveKafalat;
  const people = data.snapshot?.people || livePeople;
  const state = data.closure_state || {};
  const dist = state.zakat_distribution || {};
  const excluded = getExcluded(selectedMonth, area);
  const ym = selectedMonth;

  // Group by guardian
  const byGuardian = {};
  Object.values(snapshot).forEach(k => {
    if (k.area !== area || k.status !== 'active') return;
    const gid = k.guardian_id;
    if (!gid) return;
    const gname = (people[gid]||{}).name || '—';
    if (!byGuardian[gname]) byGuardian[gname] = {kafalat: [], total: 0, gid};
    (k.funding||[]).forEach(f => {
      if (f.prepaid_through && f.prepaid_through >= ym) return;
      const kafeelName = f.source === 'sadaqat' ? 'صدقات'
                       : f.source === 'zakat'   ? 'زكاة'
                       : (people[f.kafeel_id]||{}).name || '—';
      byGuardian[gname].kafalat.push({child: k.child, kafeel: kafeelName, amount: f.amount||0});
      byGuardian[gname].total += f.amount || 0;
    });
  });
  Object.entries(dist).forEach(([gid, amt]) => {
    const name = (people[gid]||{}).name;
    const kafala = Object.values(snapshot).find(k => k.guardian_id === gid);
    if (!name || !kafala || kafala.area !== area) return;
    if (!byGuardian[name]) byGuardian[name] = {kafalat: [], total: 0, gid};
    byGuardian[name].zakat = amt;
    byGuardian[name].total += amt;
  });

  const sorted = Object.entries(byGuardian).sort((a,b) => a[0].localeCompare(b[0]));

  let rows = '', grand = 0, exclCount = 0, exclAmt = 0;
  sorted.forEach(([gname, data]) => {
    const isExcl = excluded.has(data.gid);
    if (isExcl) { exclCount++; exclAmt += data.total; }
    const kids = data.kafalat;
    const rowCount = kids.length + (data.zakat ? 1 : 0);
    const checkTd = `<td rowspan="${rowCount+1}" style="text-align:center;vertical-align:middle">
      <span class="excl-check ${isExcl?'checked':''}" onclick="event.stopPropagation();toggleReportExclude('${area}','${data.gid}')">${isExcl?'✗':''}</span>
    </td>`;
    kids.forEach((k, i) => {
      rows += `<tr class="guardian-group-row ${isExcl?'excluded':''}">
        ${i===0 ? checkTd : ''}
        ${i===0?`<td rowspan="${rowCount}" style="font-weight:600;vertical-align:middle">${gname}</td>`:''}
        <td>${k.child||'—'}</td>
        <td>${k.kafeel}</td>
        <td class="font-mono">${fmt(k.amount)}</td>
      </tr>`;
      if (!isExcl) grand += k.amount;
    });
    if (data.zakat) {
      rows += `<tr class="guardian-group-row ${isExcl?'excluded':''}">
        <td>—</td><td><i>زكاة الشهر</i></td><td class="font-mono">${fmt(data.zakat)}</td>
      </tr>`;
      if (!isExcl) grand += data.zakat;
    }
    rows += `<tr class="guardian-group-row ${isExcl?'excluded':''}" style="background:var(--cream-deep);font-weight:700">
      <td colspan="3" style="text-align:left">إجمالي ${gname}</td>
      <td class="font-mono">${fmt(data.total)}</td>
    </tr>`;
  });

  document.getElementById('previewArea').innerHTML = `
    <div class="report-preview">
      <h2>📋 تقرير ${areaDisplay(area)} — ${arabicMonth(selectedMonth)}</h2>
      <div class="text-sm text-muted" style="margin-bottom:12px">
        عدد الأولياء الظاهر: <b>${sorted.length - exclCount}</b> من <b>${sorted.length}</b>
      </div>
      <div class="excl-toolbar no-print">
        <span>💡 اضغط مربع الاستثناء جنب أي ولي أمر لإخفائه.</span>
        <div class="spacer"></div>
        <span><b style="color:#d9534f">${exclCount}</b> مُستثنى (${fmt(exclAmt)} ج)</span>
        ${exclCount>0 ? `<button class="btn-small btn-ghost" onclick="clearReportExcluded('${area}')">↻ إعادة الكل</button>` : ''}
      </div>
      <table>
        <thead><tr>
          <th style="width:44px">استثناء</th>
          <th>ولي الأمر</th><th>الطفل</th><th>الكفيل</th><th>المبلغ</th>
        </tr></thead>
        <tbody>${rows}
          <tr style="background:var(--accent);color:#fff;font-weight:700">
            <td colspan="4">الإجمالي ${exclCount>0 ? '(بعد الاستثناء)' : ''}</td>
            <td class="font-mono">${fmt(grand)}</td>
          </tr>
        </tbody>
      </table>
      <div class="no-print flex gap mt" style="justify-content:center">
        <button onclick="window.print()">🖨️ طباعة / حفظ PDF</button>
        <button class="btn-ghost" onclick="document.getElementById('previewArea').innerHTML=''">× إغلاق</button>
      </div>
    </div>
  `;
  setTimeout(() => document.getElementById('previewArea').scrollIntoView({behavior:'smooth'}), 50);
}

function renderNashwaMsg() {
  const ym = selectedMonth;
  const data = allMonthsData[ym] || {};
  const state = data.closure_state || {};
  const byArea = monthTotalsByArea(ym);
  const snapshot = data.snapshot?.kafalat || liveKafalat;

  // Apply exclusions per area
  const adj = {};
  ['الصف','كفر_علو','المعصرة','أماكن_أخرى'].forEach(a => {
    adj[a] = byArea[a]?.total || 0;
    getExcluded(ym, a).forEach(gid => {
      const kafala = Object.values(snapshot).find(k => k.guardian_id === gid && k.area === a);
      if (!kafala) return;
      (kafala.funding||[]).forEach(f => {
        if (f.prepaid_through && f.prepaid_through >= ym) return;
        adj[a] -= f.amount || 0;
      });
      const z = (state.zakat_distribution||{})[gid] || 0;
      adj[a] -= z;
    });
    adj[a] = Math.max(0, adj[a]);
  });

  const grandAdj = Object.values(adj).reduce((s,v) => s + v, 0);
  const yousTotal = Object.values(state.youssef_by_area||{}).reduce((a,b)=>a+b,0);
  const nashTotal = Math.max(0, grandAdj - yousTotal);

  let areaLines = '';
  ['الصف','كفر_علو','المعصرة','أماكن_أخرى'].forEach(a => {
    if (adj[a]) areaLines += `• ${areaDisplay(a)}: ${fmt(adj[a])}\n`;
  });
  const kafrFee = state.include_fee
    ? `+ ${fmt(Math.round((adj['كفر_علو']||0) * 0.01))} رسوم ١٪ كفر علو\n` : '';
  const zakatUsed = Object.values(state.zakat_distribution||{}).reduce((a,b)=>a+b,0);
  const zakatRecipients = Object.keys(state.zakat_distribution||{}).length;

  const msg = `*السلام عليكم ورحمة الله وبركاته*
*ملخص ${arabicMonth(ym)}*

━━━━━━━━━━━━━━
*خطة التحويل* 📊
${areaLines}${kafrFee}
الإجمالي الكلي: *${fmt(grandAdj)}*
نصيبك: *${fmt(nashTotal)}*
نصيبي: *${fmt(yousTotal)}*

━━━━━━━━━━━━━━
*بركة الصدقات* 🤲
المدخلات الثابتة: ${fmt(state.fixed_sadaqat||4550)}
من مبلغك للصدقات: ${fmt(state.sadaqat_to_pool||0)}

*الزكاة* 💰
المتاح للتوزيع: ${fmt(state.zakat_remaining||0)}
الموزع: ${fmt(zakatUsed)} على ${zakatRecipients} مستحق (${fmt(state.zakat_share||300)} جنيه لكل)

━━━━━━━━━━━━━━
جزاكم الله خيراً 🌸`;

  document.getElementById('previewArea').innerHTML = `
    <div class="card" style="margin-top:14px">
      <div class="flex-between mb-sm">
        <h3 style="margin:0">💬 رسالة نشوى — ${arabicMonth(ym)}</h3>
        <button class="btn-gold" onclick="copyMsg('nashwaMsg')">📋 نسخ</button>
      </div>
      <div class="msg-box" id="nashwaMsg">${msg}</div>
    </div>
  `;
  setTimeout(() => document.getElementById('previewArea').scrollIntoView({behavior:'smooth'}), 50);
}

function renderSheikhMsgs() {
  const ym = selectedMonth;
  const data = allMonthsData[ym] || {};
  const state = data.closure_state || {};
  const byArea = monthTotalsByArea(ym);
  const snapshot = data.snapshot?.kafalat || liveKafalat;

  let html = '';
  ['الصف','كفر_علو','المعصرة','أماكن_أخرى'].forEach(a => {
    let total = byArea[a]?.total || 0;
    getExcluded(ym, a).forEach(gid => {
      const kafala = Object.values(snapshot).find(k => k.guardian_id === gid && k.area === a);
      if (!kafala) return;
      (kafala.funding||[]).forEach(f => {
        if (f.prepaid_through && f.prepaid_through >= ym) return;
        total -= f.amount || 0;
      });
    });
    if (!total) return;
    const msg = `*السلام عليكم ورحمة الله*
*ملخص ${arabicMonth(ym)} - منطقة ${areaDisplay(a)}*

إجمالي المنطقة: *${fmt(total)}* جنيه

جزاكم الله خيراً 🌸`;
    html += `<div class="card" style="margin-top:14px">
      <div class="flex-between mb-sm">
        <h3 style="margin:0">💬 شيخ ${areaDisplay(a)}</h3>
        <button class="btn-gold btn-small" onclick="copyMsg('msg_${a}')">📋 نسخ</button>
      </div>
      <div class="msg-box" id="msg_${a}">${msg}</div>
    </div>`;
  });
  if (!html) html = '<div class="empty-state">لا مناطق بها كفالات نشطة هذا الشهر</div>';
  document.getElementById('previewArea').innerHTML = html;
  setTimeout(() => document.getElementById('previewArea').scrollIntoView({behavior:'smooth'}), 50);
}

function copyMsg(id) {
  const t = document.getElementById(id).textContent;
  navigator.clipboard.writeText(t).then(() => toast('✓ تم النسخ', 'success'));
}

// ============= COMPARE MODE =============

function renderCompare() {
  const months = Object.keys(allMonthsData).sort().reverse();
  const withData = months.filter(m => {
    const d = allMonthsData[m];
    return d.status === 'closed' || d.status === 'draft' || (d.closure_state || d.snapshot);
  });

  document.getElementById('cmpChips').innerHTML = withData.map(m => {
    const lbl = monthStatusLabel(m);
    const active = compareSet.has(m);
    return `<div class="cmp-chip ${active?'selected':''}" onclick="toggleCompare('${m}')">
      ${arabicMonth(m)}
      <span class="dot">${lbl.cls==='closed'?'✓':'📝'}</span>
    </div>`;
  }).join('') || '<div class="text-muted">لا توجد شهور بها بيانات بعد.</div>';

  // Hint
  const hint = document.createElement('div');
  if (compareSet.size < 2) {
    document.getElementById('cmpResult').innerHTML = `
      <div class="empty-state">
        ${compareSet.size === 0 ? 'اختر شهرين أو أكثر من الأعلى للمقارنة.' : 'اختر شهر آخر على الأقل لبدء المقارنة.'}
      </div>`;
    return;
  }

  // Build comparison table
  const selected = [...compareSet].sort();
  const areas = ['الصف','كفر_علو','المعصرة','أماكن_أخرى'];
  const data = selected.map(ym => ({ym, byArea: monthTotalsByArea(ym)}));

  // Compute rows
  const header = `<tr>
    <th>المنطقة</th>
    ${data.map(d => `<th>${arabicMonth(d.ym)}</th>`).join('')}
    ${data.length >= 2 ? '<th>الاتجاه</th>' : ''}
  </tr>`;

  const rows = areas.map(a => {
    const values = data.map(d => d.byArea[a]?.total || 0);
    const first = values[0];
    const last = values[values.length - 1];
    const trend = first === 0
      ? (last > 0 ? `<span class="trend-up">جديد</span>` : `<span class="trend-flat">—</span>`)
      : (() => {
          const pct = ((last - first) / first) * 100;
          if (Math.abs(pct) < 0.5) return `<span class="trend-flat">— ثابت</span>`;
          const arrow = pct > 0 ? '⬆' : '⬇';
          const cls = pct > 0 ? 'trend-up' : 'trend-down';
          return `<span class="${cls}">${arrow} ${pct>0?'+':''}${pct.toFixed(1)}%</span>`;
        })();
    return `<tr>
      <td><b>${areaDisplay(a)}</b></td>
      ${values.map(v => `<td class="font-mono">${v ? fmt(v) : '—'}</td>`).join('')}
      ${data.length >= 2 ? `<td>${trend}</td>` : ''}
    </tr>`;
  }).join('');

  // Totals row
  const totals = data.map(d => areas.reduce((s,a) => s + (d.byArea[a]?.total||0), 0));
  const totalFirst = totals[0], totalLast = totals[totals.length-1];
  const totalTrend = totalFirst === 0
    ? '—'
    : (() => {
        const pct = ((totalLast - totalFirst) / totalFirst) * 100;
        if (Math.abs(pct) < 0.5) return `<span class="trend-flat">— ثابت</span>`;
        const arrow = pct > 0 ? '⬆' : '⬇';
        const cls = pct > 0 ? 'trend-up' : 'trend-down';
        return `<span class="${cls}">${arrow} ${pct>0?'+':''}${pct.toFixed(1)}%</span>`;
      })();

  const totalsRow = `<tr class="total-row">
    <td>الإجمالي</td>
    ${totals.map(t => `<td class="font-mono">${fmt(t)}</td>`).join('')}
    ${data.length >= 2 ? `<td>${totalTrend}</td>` : ''}
  </tr>`;

  // Zakat distributed comparison
  const zakatVals = selected.map(ym => {
    const st = (allMonthsData[ym]||{}).closure_state || {};
    return Object.values(st.zakat_distribution||{}).reduce((s,v) => s+v, 0);
  });
  const zakatCountVals = selected.map(ym => {
    const st = (allMonthsData[ym]||{}).closure_state || {};
    return Object.keys(st.zakat_distribution||{}).length;
  });

  document.getElementById('cmpResult').innerHTML = `
    <div style="margin-top:8px;overflow-x:auto">
      <table class="cmp-table">
        <thead>${header}</thead>
        <tbody>${rows}${totalsRow}</tbody>
      </table>
    </div>

    <div style="margin-top:20px;padding:14px 18px;background:var(--cream);border-radius:var(--r-sm)">
      <h4 style="margin:0 0 8px;color:var(--accent)">💰 توزيع الزكاة</h4>
      <div style="display:grid;grid-template-columns:repeat(${selected.length},1fr);gap:10px">
        ${selected.map((ym,i) => `
          <div style="text-align:center;padding:10px;background:#fff;border-radius:6px">
            <div style="font-size:11px;color:var(--muted)">${arabicMonth(ym)}</div>
            <div style="font-weight:800;font-size:16px;color:var(--accent)" class="font-mono">${fmt(zakatVals[i])}</div>
            <div style="font-size:11px;color:var(--muted)">${zakatCountVals[i]} مستحق</div>
          </div>
        `).join('')}
      </div>
    </div>

    <div class="no-print" style="margin-top:14px;text-align:center">
      <button onclick="window.print()">🖨️ طباعة / حفظ PDF</button>
    </div>
  `;
}

function toggleCompare(ym) {
  if (compareSet.has(ym)) compareSet.delete(ym);
  else compareSet.add(ym);
  renderCompare();
}

loadAll();
</script>
